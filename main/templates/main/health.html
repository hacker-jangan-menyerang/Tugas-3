<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Check - E-Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-white">
                        <h4 class="mb-0">E-Library Health Check</h4>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <span class="badge {% if db_status == 'healthy' %}bg-success{% else %}bg-danger{% endif %}">
                                Database: {{ db_status|title }}
                            </span>
                        </div>
                        <p class="mb-1"><strong>Message:</strong> {{ db_message }}</p>
                        <p class="mb-0 text-muted"><small>Checked at: {{ checked_at }}</small></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
